<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual v2 Splat Viewer</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; color: #fff; font: 14px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #toolbar { position: fixed; z-index: 1; top: 16px; left: 16px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid #ffffff33; border-radius: 8px; background: #111c; backdrop-filter: blur(8px); }
    #status { color: #ddd; }
    #status[data-error="true"] { color: #ff9b9b; }
    button { padding: 7px 10px; border: 1px solid #ffffff55; border-radius: 5px; background: #292929; color: inherit; cursor: pointer; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="toolbar">
    <button id="reset-view" type="button" disabled>Reset View</button>
    <span id="status" role="status" aria-live="polite">Loading splat…</span>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    const status = document.querySelector("#status");
    const resetButton = document.querySelector("#reset-view");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

    let initialPosition;
    let initialTarget;

    function fitToSplat(mesh) {
      const bounds = mesh.getBoundingBox(true);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());
      const dimensions = [size.x, size.y, size.z];
      const depthAxis = dimensions.indexOf(Math.min(...dimensions));
      const horizontalAxis = depthAxis === 0 ? 2 : 0;
      const depthSpan = dimensions[depthAxis];
      const horizontalSpan = dimensions[horizontalAxis];
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
      const fitDistance = Math.max(
        size.y / (2 * Math.tan(verticalFov / 2)),
        horizontalSpan / (2 * Math.tan(horizontalFov / 2))
      );
      const distance = fitDistance * 1.12 + depthSpan / 2;

      camera.up.set(0, 1, 0);
      camera.position.copy(center);
      camera.position.setComponent(depthAxis, center.getComponent(depthAxis) + distance);
      camera.near = Math.max(distance / 10000, 0.001);
      camera.far = Math.max(distance * 100, 1000);
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.update();

      initialPosition = camera.position.clone();
      initialTarget = controls.target.clone();
      resetButton.disabled = false;
      status.textContent = `${mesh.numSplats.toLocaleString()} splats`;
    }

    resetButton.addEventListener("click", () => {
      if (!initialPosition) return;
      camera.up.set(0, 1, 0);
      camera.position.copy(initialPosition);
      controls.target.copy(initialTarget);
      camera.zoom = 1;
      camera.updateProjectionMatrix();
      controls.update();
    });

    const splat = new SplatMesh({ url: "./splat_upright_manual_v2.compressed.ply" });
    scene.add(splat);

    try {
      await splat.initialized;
      fitToSplat(splat);
    } catch (error) {
      console.error("Failed to load the Gaussian splat.", error);
      status.dataset.error = "true";
      status.textContent = `Could not load splat: ${error.message}`;
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
